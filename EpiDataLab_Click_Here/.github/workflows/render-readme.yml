name: Render README

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup R and dependencies
        uses: r-lib/actions/setup-r-deps@v2
        with:
          extra-packages: rmarkdown
      - name: Render README.Rmd
        run: Rscript -e "rmarkdown::render('README.Rmd', output_format = 'github_document')"
      - name: Commit generated README.md
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add README.md || true
          git commit -m "Auto-render README from README.Rmd" || echo "No changes to commit"
          git push
